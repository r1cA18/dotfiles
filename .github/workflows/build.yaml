name: Build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13 # v17
        with:
          name: r1ca18
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build Linux home config
        run: nix build .#homeConfigurations.\"r1ca18@homelab\".activationPackage
      - name: Check homelab provisioning
        run: nix build .#checks.x86_64-linux.homelab
