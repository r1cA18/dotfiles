<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life OS Lab</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><h1>Life OS Lab</h1><p>生活の記録と出典を確認できます。バックアップから作った検証用データを表示しています。</p></header>
<main><section aria-label="検索"><form id="search"><label>検索語<input id="query" type="search" placeholder="話題やキーワード"></label><label>種類<select id="kind"><option value="">すべて</option><option value="times">Times</option><option value="knowledge">Knowledge</option><option value="project">Projects</option><option value="area">Areas</option><option value="task">Tasks</option><option value="intent">Intent</option><option value="document">Documents</option><option value="resource">Resources</option><option value="observation">Observations</option></select></label><label>日付<input id="day" type="date"></label><button>検索する</button></form><p id="stats"></p><p id="status" role="status"></p></section>
<div class="layout"><section aria-label="検索結果"><ol id="results"></ol></section><section id="detail" aria-label="記録の詳細"><h2>記録を選択</h2><p>本文と元資料への参照を確認できます。</p></section></div></main></body></html>
