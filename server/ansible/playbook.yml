---
- name: Configure the Ubuntu homelab
  hosts: all
  vars:
    homelab_user: r1ca18
    homelab_hostname: homelab
    homelab_home: "/home/{{ homelab_user }}"
    homelab_nix_cache_url: https://r1ca18.cachix.org
    homelab_nix_cache_public_key: >-
      r1ca18.cachix.org-1:1QuS/Gqqw3o1atOCkrgl+5hQoLlEvTiRN8OwQT6e6lc=
    homelab_rdp_tls_dir: >-
      /var/lib/gnome-remote-desktop/.local/share/gnome-remote-desktop
    home_assistant_root: >-
      {{ homelab_home }}/Develop/github.com/r1cA18/home-assistant
    vault_agi_root: >-
      {{ homelab_home }}/Develop/github.com/r1cA18/vault-agi
    olympus_root: >-
      {{ homelab_home }}/Develop/github.com/r1cA18/olympus
    homelab_bun: "{{ homelab_home }}/.nix-profile/bin/bun"
    homelab_service_policy_dir: /etc/homelab/services
    homelab_bun_services:
      - name: vault-agi-gateway
        description: Vault AGI gateway for Discord Times transport
        working_directory: "{{ vault_agi_root }}/gateway"
        entrypoint: "{{ vault_agi_root }}/gateway/src/index.ts"
        environment_file: "{{ vault_agi_root }}/.env"
        policy_file: "{{ homelab_service_policy_dir }}/vault-agi-gateway.env"
        policy:
          TAILSCALE_ONLY: "true"
        conditions:
          - "ConditionPathIsDirectory={{ vault_agi_root }}/gateway/data"
      - name: vault-agi-master
        description: Vault AGI Times writer
        working_directory: "{{ vault_agi_root }}/master"
        entrypoint: "{{ vault_agi_root }}/master/src/index.ts"
        environment_file: "{{ vault_agi_root }}/.env"
        policy_file: "{{ homelab_service_policy_dir }}/vault-agi-master.env"
        dependencies:
          - vault-agi-gateway
        policy:
          ENABLE_SCHEDULER: "false"
          ENABLE_SELF_REPAIR: "false"
          LINEAR_API_KEY: ""
          MEM0_URL: http://127.0.0.1:9
          NOTION_API_TOKEN: ""
          NOTION_DATABASE_ID: ""
          VIBE_KANBAN_URL: http://127.0.0.1:9
        conditions:
          - "ConditionPathIsDirectory={{ homelab_home }}/vault"
      - name: vault-agi-discord
        description: Discord Times ingestion transport
        working_directory: "{{ vault_agi_root }}/discord"
        entrypoint: "{{ vault_agi_root }}/discord/src/index.ts"
        environment_file: "{{ vault_agi_root }}/.env"
        policy_file: "{{ homelab_service_policy_dir }}/vault-agi-discord.env"
        dependencies:
          - vault-agi-gateway
        policy:
          ALLOWED_CHANNEL_IDS: __transport_only__
          ALLOWED_USER_IDS: __transport_only__
          TASK_ALLOWED_BOT_USER_IDS: __transport_only__
          TASK_CHANNEL_IDS: __transport_only__
      - name: olympus-gateway
        description: Olympus PWA REST API and WebPush gateway
        working_directory: "{{ olympus_root }}"
        entrypoint: "{{ olympus_root }}/apps/gateway/src/index.ts"
        environment_file: "{{ olympus_root }}/.env"
        conditions:
          - "ConditionPathIsDirectory={{ olympus_root }}/apps/web/dist"
          - "ConditionPathExists={{ olympus_root }}/data/olympus.db"
    homelab_install_desktop_apps: true
    homelab_lan_networks:
      - 192.168.0.0/24
    homelab_lan_tcp_ports:
      - "8123" # Home Assistant
      - "21063" # HomeKit bridge
      - "22000" # Syncthing transfer
    homelab_lan_udp_ports:
      - "1900" # SSDP discovery
      - "5353" # mDNS discovery
      - "21027" # Syncthing local discovery
      - "22000" # Syncthing QUIC transfer

  pre_tasks:
    - name: Require root execution for local provisioning
      ansible.builtin.assert:
        that:
          - ansible_facts["user_uid"] == 0
        fail_msg: "Run this playbook through `nix run .#homelab-apply`."

    - name: Require a supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
          - ansible_facts["distribution_version"] == "26.04"
        fail_msg: >-
          This profile targets Ubuntu Desktop 26.04 LTS.
          Detected {{ ansible_facts["distribution"] }}
          {{ ansible_facts["distribution_version"] }}.

    - name: Read the Debian architecture
      ansible.builtin.command: dpkg --print-architecture
      register: homelab_dpkg_arch
      changed_when: false

    - name: Require the x86 mini PC architecture used by this flake
      ansible.builtin.assert:
        that:
          - homelab_dpkg_arch.stdout == "amd64"
        fail_msg: "The r1ca18@homelab Home Manager profile currently targets amd64."

  tasks:
    - name: Configure the homelab Nix binary cache
      ansible.builtin.blockinfile:
        path: /etc/nix/nix.custom.conf
        create: true
        owner: root
        group: root
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED HOMELAB CACHE"
        block: |
          extra-substituters = {{ homelab_nix_cache_url }}
          extra-trusted-public-keys = {{ homelab_nix_cache_public_key }}
      notify: Restart Nix daemon

    - name: Set the host name
      ansible.builtin.hostname:
        name: "{{ homelab_hostname }}"

    - name: Read the current time zone
      ansible.builtin.command: timedatectl show --property=Timezone --value
      register: homelab_current_timezone
      changed_when: false

    - name: Set the time zone
      ansible.builtin.command: timedatectl set-timezone Asia/Tokyo
      when: homelab_current_timezone.stdout != "Asia/Tokyo"
      changed_when: true

    - name: Install base system packages
      ansible.builtin.apt:
        name:
          - acl
          - apparmor
          - avahi-daemon
          - bluetooth
          - bluez
          - ca-certificates
          - curl
          - dbus
          - git
          - gnome-remote-desktop
          - gnupg
          - jq
          - libcanberra-gtk3-module
          - openssh-server
          - rsync
          - ufw
          - unattended-upgrades
          - winpr-utils
          - xz-utils
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable host services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - avahi-daemon
        - bluetooth
        - ssh

    - name: Create the GNOME remote login TLS directory
      ansible.builtin.file:
        path: "{{ homelab_rdp_tls_dir }}"
        state: directory
        owner: gnome-remote-desktop
        group: gnome-remote-desktop
        mode: "0700"

    - name: Check the GNOME remote login TLS key
      ansible.builtin.stat:
        path: "{{ homelab_rdp_tls_dir }}/tls.key"
      register: homelab_rdp_tls_key

    - name: Check the GNOME remote login TLS certificate
      ansible.builtin.stat:
        path: "{{ homelab_rdp_tls_dir }}/tls.crt"
      register: homelab_rdp_tls_cert

    - name: Remove an incomplete GNOME remote login TLS pair
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ homelab_rdp_tls_dir }}/tls.key"
        - "{{ homelab_rdp_tls_dir }}/tls.crt"
      when: homelab_rdp_tls_key.stat.exists != homelab_rdp_tls_cert.stat.exists

    - name: Generate the GNOME remote login TLS pair
      ansible.builtin.command:
        argv:
          - runuser
          - --user
          - gnome-remote-desktop
          - --
          - winpr-makecert
          - -silent
          - -rdp
          - -path
          - "{{ homelab_rdp_tls_dir }}"
          - tls
      args:
        creates: "{{ homelab_rdp_tls_dir }}/tls.key"

    - name: Secure the GNOME remote login TLS key
      ansible.builtin.file:
        path: "{{ homelab_rdp_tls_dir }}/tls.key"
        owner: gnome-remote-desktop
        group: gnome-remote-desktop
        mode: "0600"

    - name: Configure the GNOME remote login TLS key
      ansible.builtin.command:
        argv:
          - grdctl
          - --system
          - rdp
          - set-tls-key
          - "{{ homelab_rdp_tls_dir }}/tls.key"
      changed_when: false

    - name: Configure the GNOME remote login TLS certificate
      ansible.builtin.command:
        argv:
          - grdctl
          - --system
          - rdp
          - set-tls-cert
          - "{{ homelab_rdp_tls_dir }}/tls.crt"
      changed_when: false

    - name: Configure the GNOME remote login authentication method
      ansible.builtin.command:
        argv:
          - grdctl
          - --system
          - rdp
          - set-auth-methods
          - credentials
      changed_when: false

    - name: Enable the GNOME remote login RDP backend
      ansible.builtin.command:
        argv:
          - grdctl
          - --system
          - rdp
          - enable
      changed_when: false

    - name: Enable GNOME remote login services at boot
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
      loop:
        - gdm.service
        - gnome-remote-desktop.service

    - name: Disable sleep states for server operation
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target

    - name: Keep the user service manager running without a GUI login
      ansible.builtin.command: "loginctl enable-linger {{ homelab_user }}"
      args:
        creates: "/var/lib/systemd/linger/{{ homelab_user }}"

    - name: Allow the Nix-managed Codex sandbox to create user namespaces
      ansible.builtin.template:
        src: codex-app-server.apparmor.j2
        dest: /etc/apparmor.d/codex-app-server
        owner: root
        group: root
        mode: "0644"
      notify: Reload Codex AppArmor profile

    - name: Add the homelab user to hardware access groups
      ansible.builtin.user:
        name: "{{ homelab_user }}"
        groups:
          - dialout
          - plugdev
          - render
          - video
        append: true

    - name: Enable IP forwarding for the Tailscale exit node
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-tailscale.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
      notify: Apply sysctl settings

    - name: Increase inotify capacity for large Syncthing trees
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-homelab-inotify.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          fs.inotify.max_user_watches = 524288
          fs.inotify.max_user_instances = 1024
      notify: Apply sysctl settings

    - name: Create the APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add the Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
      notify: Refresh APT cache

    - name: Add the Docker package repository
      ansible.builtin.template:
        src: docker.sources.j2
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: "0644"
      notify: Refresh APT cache

    - name: Add the Tailscale signing key
      ansible.builtin.get_url:
        url: >-
          https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts["distribution_release"] }}.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"
      notify: Refresh APT cache

    - name: Add the Tailscale package repository
      ansible.builtin.get_url:
        url: >-
          https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts["distribution_release"] }}.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list
        owner: root
        group: root
        mode: "0644"
      notify: Refresh APT cache

    - name: Apply repository changes before package installation
      ansible.builtin.meta: flush_handlers

    - name: Remove packages that conflict with Docker Engine
      ansible.builtin.apt:
        name:
          - containerd
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - docker.io
          - podman-docker
          - runc
        state: absent

    - name: Install Docker Engine and Tailscale
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
          - tailscale
        state: present
        update_cache: true

    - name: Enable Docker and Tailscale
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - docker
        - tailscaled

    - name: Give the homelab user Docker access
      ansible.builtin.user:
        name: "{{ homelab_user }}"
        groups: docker
        append: true

    - name: Read installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Download the official Google Chrome package
      ansible.builtin.get_url:
        url: >-
          https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        dest: /tmp/google-chrome-stable_current_amd64.deb
        mode: "0644"
      when:
        - homelab_install_desktop_apps | bool
        - homelab_dpkg_arch.stdout == "amd64"
        - "'google-chrome-stable' not in ansible_facts.packages"

    - name: Install Google Chrome and its signed update repository
      ansible.builtin.apt:
        deb: /tmp/google-chrome-stable_current_amd64.deb
      when:
        - homelab_install_desktop_apps | bool
        - homelab_dpkg_arch.stdout == "amd64"
        - "'google-chrome-stable' not in ansible_facts.packages"

    - name: Download the official ChatGPT package
      ansible.builtin.get_url:
        url: >-
          https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_{{ homelab_dpkg_arch.stdout }}.deb
        dest: "/tmp/chatgpt_{{ homelab_dpkg_arch.stdout }}.deb"
        mode: "0644"
      when:
        - homelab_install_desktop_apps | bool
        - "'chatgpt' not in ansible_facts.packages"

    - name: Install ChatGPT and its signed update repository
      ansible.builtin.apt:
        deb: "/tmp/chatgpt_{{ homelab_dpkg_arch.stdout }}.deb"
      when:
        - homelab_install_desktop_apps | bool
        - "'chatgpt' not in ansible_facts.packages"

    - name: Download the official 1Password package
      ansible.builtin.get_url:
        url: https://downloads.1password.com/linux/debian/amd64/stable/1password-latest.deb
        dest: /tmp/1password-latest.deb
        mode: "0644"
      when:
        - homelab_install_desktop_apps | bool
        - homelab_dpkg_arch.stdout == "amd64"
        - "'1password' not in ansible_facts.packages"

    - name: Install 1Password and its signed update repository
      ansible.builtin.apt:
        deb: /tmp/1password-latest.deb
      when:
        - homelab_install_desktop_apps | bool
        - homelab_dpkg_arch.stdout == "amd64"
        - "'1password' not in ansible_facts.packages"

    - name: Reset UFW to the declared homelab policy
      community.general.ufw:
        state: reset

    - name: Set UFW default policies
      community.general.ufw:
        default: "{{ item.policy }}"
        direction: "{{ item.direction }}"
      loop:
        - { policy: deny, direction: incoming }
        - { policy: allow, direction: outgoing }
        - { policy: deny, direction: routed }

    - name: Allow all traffic arriving through Tailscale
      community.general.ufw:
        rule: allow
        direction: in
        interface: tailscale0
        comment: Tailscale services

    - name: Allow exit-node traffic arriving through Tailscale
      community.general.ufw:
        rule: allow
        route: true
        interface_in: tailscale0
        comment: Tailscale exit node

    - name: Allow the Tailscale direct connection port
      community.general.ufw:
        rule: allow
        port: "41641"
        proto: udp
        comment: Tailscale WireGuard

    - name: Allow home LAN TCP services
      community.general.ufw:
        rule: allow
        from_ip: "{{ item.0 }}"
        to_port: "{{ item.1 }}"
        proto: tcp
        comment: "Homelab LAN TCP {{ item.1 }}"
      loop: "{{ homelab_lan_networks | product(homelab_lan_tcp_ports) | list }}"

    - name: Allow home LAN UDP services and discovery
      community.general.ufw:
        rule: allow
        from_ip: "{{ item.0 }}"
        to_port: "{{ item.1 }}"
        proto: udp
        comment: "Homelab LAN UDP {{ item.1 }}"
      loop: "{{ homelab_lan_networks | product(homelab_lan_udp_ports) | list }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Read the current service state
      ansible.builtin.service_facts:

    - name: Remember whether the Compose service was running
      ansible.builtin.set_fact:
        homelab_compose_was_running: >-
          {{ ansible_facts.services.get('homelab-compose.service', {}).get('state') == 'running' }}

    - name: Deploy the Compose system service
      ansible.builtin.template:
        src: homelab-compose.service.j2
        dest: /etc/systemd/system/homelab-compose.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart homelab services

    - name: Deploy the Home Assistant Syncthing permission service
      ansible.builtin.template:
        src: home-assistant-sync-permissions.service.j2
        dest: /etc/systemd/system/home-assistant-sync-permissions.service
        owner: root
        group: root
        mode: "0644"

    - name: Deploy the Home Assistant Syncthing permission timer
      ansible.builtin.template:
        src: home-assistant-sync-permissions.timer.j2
        dest: /etc/systemd/system/home-assistant-sync-permissions.timer
        owner: root
        group: root
        mode: "0644"

    - name: Enable the Home Assistant Syncthing permission timer
      ansible.builtin.systemd_service:
        name: home-assistant-sync-permissions.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Reconcile Home Assistant Syncthing permissions now
      ansible.builtin.systemd_service:
        name: home-assistant-sync-permissions.service
        state: started

    - name: Create the managed service policy directory
      ansible.builtin.file:
        path: "{{ homelab_service_policy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check synchronized application environment files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ vault_agi_root }}/.env"
        - "{{ olympus_root }}/.env"
      register: homelab_application_env_files

    - name: Restrict synchronized application environment files
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: file
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: "0600"
      loop: "{{ homelab_application_env_files.results }}"
      when: item.stat.exists
      no_log: true

    - name: Deploy non-secret service policy overlays
      ansible.builtin.template:
        src: homelab-service-policy.env.j2
        dest: "{{ homelab_service.policy_file }}"
        owner: root
        group: root
        mode: "0644"
      loop: >-
        {{ homelab_bun_services | selectattr('policy_file', 'defined') | list }}
      loop_control:
        loop_var: homelab_service
        label: "{{ homelab_service.name }}"
      notify:
        - Reload systemd
        - Restart managed Bun services

    - name: Deploy managed Bun system services
      ansible.builtin.template:
        src: homelab-bun.service.j2
        dest: "/etc/systemd/system/{{ homelab_service.name }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ homelab_bun_services }}"
      loop_control:
        loop_var: homelab_service
        label: "{{ homelab_service.name }}"
      notify:
        - Reload systemd
        - Restart managed Bun services

    - name: Read the Tailscale backend state
      ansible.builtin.command: tailscale status --json
      register: homelab_tailscale_status
      changed_when: false
      failed_when: false

    - name: Configure the authenticated Tailscale node
      ansible.builtin.command: >-
        tailscale set
        --advertise-exit-node=true
        --hostname={{ homelab_hostname }}
        --operator={{ homelab_user }}
      when:
        - homelab_tailscale_status.rc == 0
        - (homelab_tailscale_status.stdout | from_json).BackendState == "Running"
      changed_when: false

    - name: Explain the one-time Tailscale login
      ansible.builtin.debug:
        msg: >-
          Run `sudo tailscale up`, authenticate in the browser, approve this
          exit node in the admin console, then rerun this playbook.
      when: >-
        homelab_tailscale_status.rc != 0 or
        (homelab_tailscale_status.stdout | from_json).BackendState != "Running"

  handlers:
    - name: Restart Nix daemon
      ansible.builtin.systemd_service:
        name: nix-daemon.service
        state: restarted

    - name: Refresh APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Reload Codex AppArmor profile
      ansible.builtin.command:
        argv:
          - apparmor_parser
          - --replace
          - /etc/apparmor.d/codex-app-server
      changed_when: true

    - name: Restart homelab services
      ansible.builtin.systemd_service:
        name: homelab-compose.service
        state: restarted
      when: homelab_compose_was_running

    - name: Restart managed Bun services
      ansible.builtin.systemd_service:
        name: "{{ item.name }}.service"
        state: restarted
      loop: "{{ homelab_bun_services }}"
      when: >-
        ansible_facts.services.get(item.name + '.service', {}).get('state') ==
        'running'
